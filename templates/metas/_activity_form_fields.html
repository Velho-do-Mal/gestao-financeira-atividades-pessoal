{# Campos do formulário de atividade/serviço do plano de ação. `a` opcional (edição). #}
<div class="field">
  <label>Título do serviço/atividade</label>
  <input class="input" type="text" name="title" placeholder="Ex.: Prospectar 10 novos clientes de projeto elétrico" value="{{ a.title if a else '' }}" required>
</div>
<div class="field">
  <label>Como farei (descrição)</label>
  <textarea class="input" name="description" placeholder="Como essa atividade contribui para a meta?">{{ a.description if a else '' }}</textarea>
</div>
<div class="form-row">
  <div class="field">
    <label>Quando inicio</label>
    <input class="input" type="date" name="start_date" value="{{ a.start_date.isoformat() if a and a.start_date else '' }}">
  </div>
  <div class="field">
    <label>Quando termino</label>
    <input class="input" type="date" name="end_date" value="{{ a.end_date.isoformat() if a and a.end_date else '' }}">
  </div>
</div>
<div class="field">
  <label>Status</label>
  <select class="input" name="status">
    {% for opt in ['Não iniciado', 'Em andamento', 'Concluído'] %}
    <option value="{{ opt }}" {{ 'selected' if a and a.status == opt else '' }}>{{ opt }}</option>
    {% endfor %}
  </select>
</div>
