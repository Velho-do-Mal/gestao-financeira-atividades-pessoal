<div class="field"><label>Banco*</label><input class="input" type="text" name="name" value="{{ bank.name if bank else '' }}" required></div>
<div class="form-row">
  <div class="field"><label>Conta</label><input class="input" type="text" name="account" value="{{ bank.account if bank else '' }}"></div>
  <div class="field"><label>Agência</label><input class="input" type="text" name="agency" value="{{ bank.agency if bank else '' }}"></div>
</div>
<div class="field"><label>Saldo inicial (R$)</label><input class="input" type="number" step="0.01" name="initial_balance" value="{{ bank.initial_balance if bank else 0 }}"></div>
